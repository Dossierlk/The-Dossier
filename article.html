<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07142b">
  <title>Article | The Dossier</title>
  <meta name="description" content="Explore mysteries and the unexplained with The Dossier.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050b18;
      --panel: rgba(15, 32, 61, .76);
      --text: #f2f7ff;
      --muted: #a5b5d1;
      --blue: #65b5ff;
      --line: rgba(120, 180, 255, .2);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, #123f83 0%, transparent 48%),
        var(--bg);
      background-attachment: fixed;
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px max(6%, calc((100% - 1120px)/2));
      background: rgba(5, 13, 31, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .brand span { color: var(--blue); }

    .back {
      padding: 10px 15px;
      color: var(--text);
      background: rgba(54, 119, 205, .16);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: background .2s, transform .2s;
    }

    .back:hover {
      background: rgba(54, 145, 255, .28);
      transform: translateY(-1px);
    }

    .wrap {
      width: min(860px, 90%);
      margin: 44px auto 80px;
    }

    .glass {
      padding: clamp(22px, 5vw, 48px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: rise .55s ease both;
    }

    .category {
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 500;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .date {
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 13px;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      max-height: 680px;
      object-fit: contain;
      margin: 24px 0 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #08152b;
    }

    .content {
      color: #dce8fb;
      font-size: 17px;
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .related {
      margin-top: 48px;
    }

    .related h2 {
      margin-bottom: 18px;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 500;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .related-card {
      display: block;
      padding: 20px;
      background: rgba(14, 31, 58, .7);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: transform .25s, border-color .25s;
    }

    .related-card:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
    }

    .related-card span {
      color: var(--blue);
      font-size: 11px;
    }

    .related-card h3 {
      margin: 10px 0 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .status {
      padding: 40px 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    footer {
      padding: 26px 5%;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .nav { padding: 15px 5%; gap: 12px; }
      .brand { font-size: 14px; letter-spacing: 2px; }
      .back { padding: 9px 11px; font-size: 12px; }
      .wrap { margin-top: 24px; }
      .glass { border-radius: 18px; }
      .content { font-size: 16px; }
      .related-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    
    .community {
      margin-top: 32px;
      padding: clamp(22px, 4vw, 36px);
    }

    .community h2 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(26px, 4vw, 36px);
    }

    .community-intro {
      color: var(--muted);
      line-height: 1.7;
      margin: 10px 0 24px;
    }

    .reaction-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .reaction-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      color: var(--text);
      background: rgba(44, 115, 220, .15);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: .2s ease;
    }

    .reaction-btn:hover {
      background: rgba(55, 145, 255, .28);
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .reaction-btn strong {
      color: var(--blue);
    }

    .comment-form {
      display: grid;
      gap: 12px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 14px 16px;
      color: var(--text);
      background: rgba(3, 12, 29, .58);
      border: 1px solid var(--line);
      border-radius: 13px;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(80, 160, 255, .12);
    }

    .comment-form textarea {
      resize: vertical;
      line-height: 1.7;
    }

    .submit-btn {
      justify-self: start;
      padding: 12px 19px;
      color: #061226;
      font-weight: 700;
      background: linear-gradient(135deg, #8bd0ff, #438cff);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(57, 137, 255, .2);
      transition: transform .2s, filter .2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    #comment-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .comments-list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .comment-card {
      padding: 17px;
      background: rgba(5, 17, 38, .55);
      border: 1px solid var(--line);
      border-radius: 15px;
      overflow-wrap: anywhere;
    }

    .comment-author {
      color: var(--blue);
      font-weight: 700;
      font-size: 14px;
    }

    .comment-date {
      margin-left: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .comment-text {
      margin: 10px 0 0;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    @media (max-width: 560px) {
      .reaction-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .reaction-btn {
        justify-content: space-between;
      }

      .submit-btn {
        width: 100%;
      }
    }
    .reaction-btn.active {
      background: rgba(55, 145, 255, .38);
      border-color: var(--blue);
    }
        /* ===== iOS glossy upgrade ===== */
    :root {
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { -webkit-tap-highlight-color: transparent; }

    /* Floating glass nav */
    .nav {
      top: 12px;
      width: min(1120px, 94%);
      margin: 12px auto 0;
      padding: 12px 18px;
      border-radius: 22px;
      background: rgba(15, 32, 61, .42);
      border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .22),
        0 12px 40px rgba(0, 0, 0, .35);
    }

    /* Glass panels */
    .glass {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .03)),
        rgba(15, 32, 61, .55);
      border: 1px solid rgba(255, 255, 255, .13);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25),
        inset 0 -1px 0 rgba(255, 255, 255, .04),
        0 24px 70px rgba(0, 0, 0, .35);
    }

    /* Glossy shine on top of panels */
    .glass::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), transparent);
      pointer-events: none;
    }

    .community { border-radius: 24px; }

    /* Buttons: pill + glossy + spring press */
    .back,
    .reaction-btn,
    .related-card,
    .submit-btn {
      transition: transform .35s var(--spring), background .25s, border-color .25s, box-shadow .25s, filter .25s;
    }

    .back {
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
    }

    .reaction-btn {
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
      border: 1px solid rgba(255, 255, 255, .15);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 6px 18px rgba(0, 0, 0, .2);
    }

    .reaction-btn.active {
      background: linear-gradient(180deg, rgba(120, 190, 255, .55), rgba(55, 130, 255, .35));
      border-color: rgba(140, 200, 255, .7);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .45),
        0 0 24px rgba(80, 160, 255, .35);
    }

    .submit-btn {
      border-radius: 999px;
      background: linear-gradient(180deg, #9fdcff 0%, #4a92ff 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .6),
        0 10px 28px rgba(57, 137, 255, .4);
    }

    .back:active,
    .reaction-btn:active,
    .submit-btn:active,
    .related-card:active {
      transform: scale(.95);
    }

    .related-card {
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02));
      border: 1px solid rgba(255, 255, 255, .13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Inputs + comments */
    .comment-form input,
    .comment-form textarea {
      border-radius: 16px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .13);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .25);
    }

    .comment-card {
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      border: 1px solid rgba(255, 255, 255, .11);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .cover { border-radius: 22px; }

    @media (max-width: 560px) {
      .nav { padding: 11px 14px; border-radius: 20px; }
      .glass { border-radius: 24px; }
    }
    
/* iOS-style loading spinner */
.ios-loader {
  width: 38px;
  height: 38px;
  position: relative;
  margin: 30px auto;
  color: #9fdcff;
  animation: ios-spin 1s steps(8) infinite;
}

.ios-loader::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(
    from 0deg,
    currentColor 0deg 18deg,
    transparent 18deg 45deg
  );
  -webkit-mask: radial-gradient(
    farthest-side,
    transparent calc(100% - 6px),
    #000 calc(100% - 5px)
  );
  mask: radial-gradient(
    farthest-side,
    transparent calc(100% - 6px),
    #000 calc(100% - 5px)
  );
  border-radius: 50%;
}

@keyframes ios-spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .ios-loader { animation-duration: 2s; }
}
    
/* ===== THE DOSSIER: Animated iOS Reactions ===== */
.reaction-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0 28px;
}

.reaction-btn {
  --reaction-color: #8ac7ff;
  position: relative;
  isolation: isolate;
  flex: 1 1 105px;
  min-width: 0;
  min-height: 86px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  color: var(--text);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 21px;
  background: linear-gradient(
    155deg,
    rgba(255,255,255,.12),
    rgba(255,255,255,.025)
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 7px 20px rgba(0,0,0,.16);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  transition:
    transform .28s var(--spring),
    border-color .25s,
    background .25s,
    box-shadow .25s;
}

.reaction-btn[data-reaction="like"] { --reaction-color:#70b7ff; }
.reaction-btn[data-reaction="love"] { --reaction-color:#ff668b; }
.reaction-btn[data-reaction="wow"] { --reaction-color:#ffc76b; }
.reaction-btn[data-reaction="sad"] { --reaction-color:#75c6ff; }
.reaction-btn[data-reaction="angry"] { --reaction-color:#ff655f; }

.reaction-btn:hover {
  transform: translateY(-3px);
  border-color: var(--reaction-color);
  box-shadow: 0 8px 25px color-mix(in srgb, var(--reaction-color) 18%, transparent);
}

.reaction-btn:active {
  transform: scale(.94);
}

.reaction-btn:disabled {
  cursor: wait;
  opacity: .75;
}

.reaction-emoji {
  display: inline-block;
  position: relative;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  font-size: 29px;
  line-height: 1.2;
  transform-origin: 50% 80%;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.18));
}

.reaction-label {
  font-size: 12px;
  font-weight: 600;
}

.reaction-btn strong {
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.reaction-btn.active {
  border-color: var(--reaction-color);
  background: linear-gradient(
    155deg,
    color-mix(in srgb, var(--reaction-color) 24%, transparent),
    rgba(255,255,255,.045)
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 22px color-mix(in srgb, var(--reaction-color) 19%, transparent);
}

.reaction-btn.active strong,
.reaction-btn.active .reaction-label {
  color: var(--reaction-color);
}

/* Like: thumbs-up spring bounce */
.reaction-btn.play-like .reaction-emoji {
  animation: reaction-like .7s var(--spring);
}

@keyframes reaction-like {
  0% { transform: translateY(9px) rotate(-22deg) scale(.55); }
  45% { transform: translateY(-8px) rotate(12deg) scale(1.3); }
  70% { transform: translateY(2px) rotate(-5deg) scale(.94); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}

/* Love: double heartbeat */
.reaction-btn.play-love .reaction-emoji {
  animation: reaction-love .85s ease-in-out;
}

@keyframes reaction-love {
  0%, 100% { transform: scale(1); }
  18% { transform: scale(1.38); }
  32% { transform: scale(.94); }
  48% { transform: scale(1.28); }
  65% { transform: scale(1); }
}

/* Wow: pop + shockwave */
.reaction-btn.play-wow::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 24px;
  height: 24px;
  border: 2px solid var(--reaction-color);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  animation: reaction-wave .65s ease-out;
}

.reaction-btn.play-wow .reaction-emoji {
  animation: reaction-wow .6s var(--spring);
}

@keyframes reaction-wow {
  0% { transform: scale(.45); }
  50% { transform: scale(1.48) rotate(-8deg); }
  75% { transform: scale(.9) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

@keyframes reaction-wave {
  0% { transform: scale(.3); opacity: .8; }
  100% { transform: scale(5); opacity: 0; }
}

/* Sad: gentle drop + tear */
.reaction-btn.play-sad .reaction-emoji {
  animation: reaction-sad .7s ease-in-out;
}

.reaction-btn.play-sad .reaction-emoji::after {
  content: "💧";
  position: absolute;
  font-size: 12px;
  left: 55%;
  top: 38%;
  opacity: 0;
  animation: reaction-tear .75s .12s ease-in forwards;
  pointer-events: none;
}

@keyframes reaction-sad {
  0% { transform: translateY(-5px) rotate(0); }
  35% { transform: translateY(4px) rotate(-9deg); }
  60% { transform: translateY(1px) rotate(5deg); }
  100% { transform: translateY(0) rotate(0); }
}

@keyframes reaction-tear {
  0% { transform: translateY(-2px); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(4px, 23px) scale(.75); opacity: 0; }
}

/* Angry: shake + red flash */
.reaction-btn.play-angry {
  animation: reaction-angry-glow .65s ease-out;
}

.reaction-btn.play-angry .reaction-emoji {
  animation: reaction-angry .55s ease-in-out;
}

@keyframes reaction-angry {
  0%, 100% { transform: translateX(0) rotate(0); }
  15%, 45%, 75% { transform: translateX(-4px) rotate(-8deg); }
  30%, 60%, 90% { transform: translateX(4px) rotate(8deg); }
}

@keyframes reaction-angry-glow {
  0%, 100% { box-shadow: 0 0 0 transparent; }
  35% { box-shadow: 0 0 28px rgba(255,65,65,.5); }
}

@media (max-width: 560px) {
  .reaction-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }

  .reaction-btn {
    min-width: 0;
    min-height: 77px;
    padding: 9px 2px;
    gap: 4px;
    border-radius: 16px;
  }

  .reaction-emoji { font-size: 25px; }
  .reaction-label { font-size: 10px; }
  .reaction-btn strong { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .reaction-btn,
  .reaction-emoji,
  .reaction-btn::before {
    animation: none !important;
    transition: none !important;
  }
}
    
/* iOS-style reading progress */
#reading-progress-track {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  z-index: 9999;
  background: rgba(120, 170, 255, 0.12);
  pointer-events: none;
}

#reading-progress-bar {
  width: 0%;
  height: 100%;
  border-radius: 0 999px 999px 0;
  background: linear-gradient(90deg, #398bff, #8bd0ff);
  box-shadow: 0 0 12px rgba(75, 155, 255, 0.75);
  transition: width 0.12s linear;
}
    
/* Premium reading toolbar */
.reading-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px 0 24px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(100, 160, 255, .07);
  color: var(--muted);
  font-size: 12px;
}

.reading-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.reading-actions button {
  padding: 8px 11px;
  color: var(--text);
  background: rgba(120, 170, 255, .12);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 12px;
  transition: transform .2s, background .2s;
}

.reading-actions button:hover {
  background: rgba(100, 170, 255, .24);
}

.reading-actions button:active {
  transform: scale(.95);
}

.reading-actions button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

/* Light reading theme */
body.light-theme {
  color-scheme: light;
  --bg: #f3f6fc;
  --panel: rgba(255, 255, 255, .94);
  --text: #17243a;
  --muted: #596b84;
  --blue: #1769c2;
  --line: rgba(35, 80, 135, .18);

  background: #f3f6fc;
  color: var(--text);
}

body.light-theme .nav {
  background: rgba(245, 248, 255, .92);
}

body.light-theme .glass {
  background: rgba(255, 255, 255, .88);
  border-color: var(--line);
  box-shadow: 0 18px 55px rgba(30, 55, 90, .09);

  <script>
    const SUPABASE_URL = "https://bvafftvtucyjixadhzeu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QEBgCvFEuT1io7gyyr_AZA_8R4V5W1k";

    const db = window.supabase.createClient(

      if (!post) {

      }

function updateReadingTime() {

let currentPostId = null;

let visitorId = localStorage.getItem("dossier-visitor-id");

if (!visitorId) {
  visitorId = crypto.randomUUID();
  localStorage.setItem("dossier-visitor-id", visitorId);
}
    

async function loadPostViews(postId) {
  const viewElement = document.getElementById("view-count");
  if (!viewElement) return;

  const storageKey = `dossier_viewed_${postId}`;

  try {
    // Has this browser already counted this article?
    const alreadyViewed = localStorage.getItem(storageKey);

    if (alreadyViewed) {
      // Read the current count without incrementing it
      const { data, error } = await db
        .from("posts")
        .select("views")
        .eq("id", postId)
        .eq("published", true)
        .single();

      if (error) throw error;

      viewElement.textContent =
        `👁 ${(data.views ?? 0).toLocaleString()} views`;
      return;
    }

    // First view from this browser: increment once
    const { data, error } = await db.rpc(
      "increment_post_views",
      { p_post_id: postId }
    );

    if (error) throw error;

    // Remember only after the increment succeeds
    localStorage.setItem(storageKey, "1");

    viewElement.textContent =
      `👁 ${(data ?? 0).toLocaleString()} views`;

  } catch (error) {
    console.error("View counter error:", error);
    viewElement.hidden = true;
  }
}

async function loadRelated(currentId) {
  const { data, error } = await db
    .from("posts")
    .select("id, title, slug, category")
    .eq("published", true)
    .neq("id", currentId)
    .order("created_at", { ascending: false })
    .limit(4);

  if (error) {
    console.error("Related stories error:", error);
    return;
  }

  if (!data || data.length === 0) return;

  const grid = document.getElementById("related-grid");
  grid.replaceChildren();

  data.forEach(post => {
    const link = document.createElement("a");
    link.className = "related-card";
    link.href = `article.html?${post.slug
      ? `slug=${encodeURIComponent(post.slug)}`
      : `id=${encodeURIComponent(post.id)}`}`;

    const category = document.createElement("span");
    category.textContent = post.category || "Mystery";

    const title = document.createElement("h3");
    title.textContent = post.title || "Untitled story";

    link.append(category, title);
    grid.appendChild(link);
  });

  document.getElementById("related-section").hidden = false;
}

    function renderComments(comments) {
      const list = document.getElementById("comments-list");
      list.replaceChildren();

      if (!comments.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "community-intro";
        emptyMessage.textContent = "No comments yet. Be the first to share your thoughts.";
        list.appendChild(emptyMessage);
        return;
      }

      comments.forEach(comment => {
        const card = document.createElement("article");
        card.className = "comment-card";

        const author = document.createElement("span");
        author.className = "comment-author";
        author.textContent = comment.display_name || "Anonymous";

        const date = document.createElement("span");
        date.className = "comment-date";
        date.textContent = comment.created_at
          ? new Date(comment.created_at).toLocaleDateString()
          : "";

        const content = document.createElement("p");
        content.className = "comment-text";
        content.textContent = comment.content || "";

        card.append(author, date, content);
        list.appendChild(card);
      });
    }


const reactionTypes = ["like", "love", "wow", "sad", "angry"];

const reactionRow = document.getElementById("reaction-row");

if (reactionRow) {
  reactionRow.addEventListener("click", event => {
    const button = event.target.closest(".reaction-btn");

    if (!button || button.disabled) return;

    const reaction = button.dataset.reaction;

    if (reactionTypes.includes(reaction)) {
      addReaction(reaction);
    }
  });
}

function playReactionAnimation(reaction) {
  const button = document.querySelector(
    `.reaction-btn[data-reaction="${reaction}"]`
  );

  if (!button) return;

  const animationClass = `play-${reaction}`;

  button.classList.remove(animationClass);
  void button.offsetWidth;
  button.classList.add(animationClass);

  button.addEventListener("animationend", () => {
    button.classList.remove(animationClass);
  }, { once: true });
}

function updateSelectedReaction(reaction) {
  document.querySelectorAll(".reaction-btn").forEach(button => {
    const selected = button.dataset.reaction === reaction;

    button.classList.toggle("active", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
}

async function addReaction(reaction) {
  if (!currentPostId) return;

  const buttons = document.querySelectorAll(".reaction-btn");
  buttons.forEach(button => button.disabled = true);

  const status = document.getElementById("comment-status");

  try {
    const { data, error } = await db.rpc("toggle_reaction", {
      p_post_id: currentPostId,
      p_reaction: reaction,
      p_visitor_id: visitorId
    });

    if (error) throw error;

    if (data === "removed") {
      updateSelectedReaction(null);
      status.textContent = "Reaction removed.";
    } else {
      updateSelectedReaction(reaction);
      playReactionAnimation(reaction);
      status.textContent = "Thanks for your reaction!";
    }

    await loadCommunity();
  } catch (error) {
    console.error("Reaction error:", error);
    status.textContent = "Reaction failed. Please try again.";
  } finally {
    buttons.forEach(button => button.disabled = false);
  }
}

    async function submitComment() {
      const nameInput = document.getElementById("comment-name");
      const contentInput = document.getElementById("comment-input");
      const status = document.getElementById("comment-status");
      const button = document.getElementById("comment-submit");

      const name = nameInput.value.trim();
      const content = contentInput.value.trim();

      if (!content) {
        status.textContent = "Please write a comment first.";
        return;
      }

      if (content.length > 2000 || name.length > 40) {
        status.textContent = "Your comment or name is too long.";
        return;
      }

      button.disabled = true;
      status.textContent = "Posting comment...";

      const { error } = await db.from("comments").insert({
        post_id: currentPostId,
        content,
        display_name: name || "Anonymous",
        user_id: null
      });

      button.disabled = false;

      if (error) {
        console.error("Comment insert error:", error);
        status.textContent =
          "Comment could not be posted. Please try again.";
        return;
      }

      contentInput.value = "";
      status.textContent = "Comment posted!";
      await loadCommunity();
    }
    document.getElementById("comment-submit").addEventListener("click", submitComment);

    async function loadCommunity() {
      if (!currentPostId) return;

      const [commentsResult, reactionsResult] = await Promise.all([
        db
          .from("comments")
          .select("id, post_id, content, display_name, created_at")
          .eq("post_id", currentPostId)
          .order("created_at", { ascending: false }),
        db
          .from("reactions")
          .select("reaction")
          .eq("post_id", currentPostId)
      ]);

      if (commentsResult.error) {
        console.error("Comments loading error:", commentsResult.error);
      } else {
        renderComments(commentsResult.data || []);
      }

      if (reactionsResult.error) {
        console.error("Reactions loading error:", reactionsResult.error);
        return;
      }

      const reactions = reactionsResult.data || [];

reactionTypes.forEach(reaction => {
  const count = reactions.filter(
    item => item.reaction === reaction
  ).length;

  document.getElementById(`${reaction}-count`).textContent = count;
});

    }

    loadArticle();
    
function updateReadingProgress() {
  const bar = document.getElementById("reading-progress-bar");
  if (!bar) return;

  const scrollableHeight =
    document.documentElement.scrollHeight - window.innerHeight;

  const progress = scrollableHeight > 0
    ? (window.scrollY / scrollableHeight) * 100
    : 0;

  bar.style.width = `${Math.min(100, Math.max(0, progress))}%`;
}

window.addEventListener("scroll", updateReadingProgress, {
  passive: true
});

window.addEventListener("resize", updateReadingProgress);

window.addEventListener("load", updateReadingProgress);

updateReadingProgress();
    
/* ===== THE DOSSIER: Reading controls ===== */

const themeToggle = document.getElementById("theme-toggle");
const fontIncrease = document.getElementById("font-increase");
const fontDecrease = document.getElementById("font-decrease");
const shareButton = document.getElementById("share-article");
const articleContent = document.getElementById("content");

const defaultFontSize = 17;
const minFontSize = 13;
const maxFontSize = 27;
let currentFontSize = defaultFontSize;

// Restore saved theme and font size safely.
try {
  if (localStorage.getItem("dossier-theme") === "light") {
    document.body.classList.add("light-theme");
  }

  const savedSize = Number(localStorage.getItem("dossier-font-size"));

  if (savedSize >= minFontSize && savedSize <= maxFontSize) {
    currentFontSize = savedSize;
  }
} catch (error) {
  console.warn("Reading preferences unavailable:", error);
}

function applyTheme() {
  const isLight = document.body.classList.contains("light-theme");

  themeToggle.textContent = isLight ? "🌙 Dark" : "☀️ Light";
  themeToggle.setAttribute(
    "aria-label",
    isLight ? "Switch to dark mode" : "Switch to light mode"
  );

  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute("content", isLight ? "#f3f6fc" : "#07142b");
}

function applyFontSize() {
  if (!articleContent) return;

  articleContent.style.fontSize = `${currentFontSize}px`;

  try {
    localStorage.setItem("dossier-font-size", String(currentFontSize));
  } catch (error) {
    console.warn("Could not save font size:", error);
  }
}

themeToggle?.addEventListener("click", () => {
  document.body.classList.toggle("light-theme");

  try {
    localStorage.setItem(
      "dossier-theme",
      document.body.classList.contains("light-theme")
        ? "light"
        : "dark"
    );
  } catch (error) {
    console.warn("Could not save theme:", error);
  }

  applyTheme();
});

fontIncrease?.addEventListener("click", () => {
  currentFontSize = Math.min(maxFontSize, currentFontSize + 2);
  applyFontSize();
});

fontDecrease?.addEventListener("click", () => {
  currentFontSize = Math.max(minFontSize, currentFontSize - 2);
  applyFontSize();
});

shareButton?.addEventListener("click", async () => {
  const shareData = {
    title: document.getElementById("title")?.textContent || document.title,
    text: "Discover this mystery on The Dossier.",
    url: window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(shareData.url);
      shareButton.textContent = "✓ Link copied";

      setTimeout(() => {
        shareButton.textContent = "↗ Share";
      }, 2000);
    } else {
      window.prompt("Copy this article link:", shareData.url);
    }
  } catch (error) {
    if (error?.name !== "AbortError") {
      console.error("Share failed:", error);
    }
  }
});

applyTheme();
applyFontSize();

  </script>
