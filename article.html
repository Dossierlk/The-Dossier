
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07142b">
  <title>Article | The Dossier</title>
  <meta name="description" content="Explore mysteries and the unexplained with The Dossier.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050b18;
      --panel: rgba(15, 32, 61, .76);
      --text: #f2f7ff;
      --muted: #a5b5d1;
      --blue: #65b5ff;
      --line: rgba(120, 180, 255, .2);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, #123f83 0%, transparent 48%),
        var(--bg);
      background-attachment: fixed;
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px max(6%, calc((100% - 1120px)/2));
      background: rgba(5, 13, 31, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .brand span { color: var(--blue); }

    .back {
      padding: 10px 15px;
      color: var(--text);
      background: rgba(54, 119, 205, .16);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: background .2s, transform .2s;
    }

    .back:hover {
      background: rgba(54, 145, 255, .28);
      transform: translateY(-1px);
    }

    .wrap {
      width: min(860px, 90%);
      margin: 44px auto 80px;
    }

    .glass {
      padding: clamp(22px, 5vw, 48px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: rise .55s ease both;
    }

    .category {
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 500;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .date {
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 13px;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      max-height: 680px;
      object-fit: contain;
      margin: 24px 0 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #08152b;
    }

    .content {
      color: #dce8fb;
      font-size: 17px;
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .related {
      margin-top: 48px;
    }

    .related h2 {
      margin-bottom: 18px;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 500;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .related-card {
      display: block;
      padding: 20px;
      background: rgba(14, 31, 58, .7);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: transform .25s, border-color .25s;
    }

    .related-card:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
    }

    .related-card span {
      color: var(--blue);
      font-size: 11px;
    }

    .related-card h3 {
      margin: 10px 0 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .status {
      padding: 40px 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    footer {
      padding: 26px 5%;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .nav { padding: 15px 5%; gap: 12px; }
      .brand { font-size: 14px; letter-spacing: 2px; }
      .back { padding: 9px 11px; font-size: 12px; }
      .wrap { margin-top: 24px; }
      .glass { border-radius: 18px; }
      .content { font-size: 16px; }
      .related-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    
    .community {
      margin-top: 32px;
      padding: clamp(22px, 4vw, 36px);
    }

    .community h2 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(26px, 4vw, 36px);
    }

    .community-intro {
      color: var(--muted);
      line-height: 1.7;
      margin: 10px 0 24px;
    }

    .reaction-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .reaction-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      color: var(--text);
      background: rgba(44, 115, 220, .15);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: .2s ease;
    }

    .reaction-btn:hover {
      background: rgba(55, 145, 255, .28);
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .reaction-btn strong {
      color: var(--blue);
    }

    .comment-form {
      display: grid;
      gap: 12px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 14px 16px;
      color: var(--text);
      background: rgba(3, 12, 29, .58);
      border: 1px solid var(--line);
      border-radius: 13px;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(80, 160, 255, .12);
    }

    .comment-form textarea {
      resize: vertical;
      line-height: 1.7;
    }

    .submit-btn {
      justify-self: start;
      padding: 12px 19px;
      color: #061226;
      font-weight: 700;
      background: linear-gradient(135deg, #8bd0ff, #438cff);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(57, 137, 255, .2);
      transition: transform .2s, filter .2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    #comment-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .comments-list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .comment-card {
      padding: 17px;
      background: rgba(5, 17, 38, .55);
      border: 1px solid var(--line);
      border-radius: 15px;
      overflow-wrap: anywhere;
    }

    .comment-author {
      color: var(--blue);
      font-weight: 700;
      font-size: 14px;
    }

    .comment-date {
      margin-left: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .comment-text {
      margin: 10px 0 0;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    @media (max-width: 560px) {
      .reaction-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .reaction-btn {
        justify-content: space-between;
      }

      .submit-btn {
        width: 100%;
      }
    }

  </style>
</head>

<body>
  <header class="nav">
    <a class="brand" href="index.html"><span>THE</span> DOSSIER</a>
    <a class="back" href="index.html">← All stories</a>
  </header>

  <main class="wrap">
    <div id="article-status" class="status">Loading story...</div>

    <article id="article" class="glass" hidden>
      <span id="category" class="category"></span>
      <h1 id="title"></h1>
      <p id="date" class="date"></p>
      <img id="cover" class="cover" alt="" hidden>
      <div id="content" class="content"></div>
      
    <section class="community glass" id="community">
      <h2>Join the conversation</h2>
      <p class="community-intro">Share your thoughts about this mystery.</p>

      <div class="reaction-row">
        <button type="button" class="reaction-btn" id="like-btn">
          💙 <span>Interesting</span> <strong id="like-count">0</strong>
        </button>
        <button type="button" class="reaction-btn" id="mind-btn">
          🤯 <span>Mind-blowing</span> <strong id="mind-count">0</strong>
        </button>
      </div>

      <div class="comment-form">
        <input id="comment-name" type="text" maxlength="40"
          placeholder="Your name (optional)">
        <textarea id="comment-input" maxlength="2000"
          placeholder="Write your comment..." rows="4"></textarea>
        <button type="button" class="submit-btn" id="comment-submit">
          Post comment ↗
        </button>
        <p id="comment-status" role="status"></p>
      </div>

      <div id="comments-list" class="comments-list"></div>
    </section>
      
    </article>

    <section class="related" id="related-section" hidden>
      <h2>Related stories</h2>
      <div id="related-grid" class="related-grid"></div>
    </section>
  </main>

  <footer>Independent stories. Endless questions. © <span id="year"></span> The Dossier</footer>

  <script>
    const SUPABASE_URL = "https://bvafftvtucyjixadhzeu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QEBgCvFEuT1io7gyyr_AZA_8R4V5W1k";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const statusBox = document.getElementById("article-status");
    const articleBox = document.getElementById("article");
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const postId = params.get("id");

    document.getElementById("year").textContent = new Date().getFullYear();

    async function loadArticle() {
      if (!slug && !postId) {
        statusBox.textContent = "No story selected. Please return to all stories.";
        return;
      }

      let query = db
        .from("posts")
        .select("id, title, slug, content, image_url, category, created_at")
        .eq("published", true);

      query = slug ? query.eq("slug", slug) : query.eq("id", postId);

      const { data: post, error } = await query.maybeSingle();

      if (error) {
        console.error("Article loading error:", error);
        statusBox.textContent = "The story could not be loaded. Please try again later.";
        return;
      }

      if (!post) {
        statusBox.textContent = "Story not found. It may have been unpublished.";
        return;
      }

      document.title = `${post.title || "Story"} | The Dossier`;
      document.getElementById("category").textContent = post.category || "Mystery";
      document.getElementById("title").textContent = post.title || "Untitled story";
      document.getElementById("date").textContent = post.created_at
        ? new Date(post.created_at).toLocaleDateString()
        : "";
      document.getElementById("content").textContent =
        post.content || "No article content available.";

      const cover = document.getElementById("cover");
      if (post.image_url) {
        cover.src = post.image_url;
        cover.alt = post.title || "Article cover";
        cover.hidden = false;
      } else {
        cover.hidden = true;
      }

     
      statusBox.hidden = true;
      articleBox.hidden = false;

      currentPostId = post.id;
      loadCommunity();
      loadRelated(post.id);

    }

    async function loadRelated(currentId) {
      
    let currentPostId = null;
    let visitorId = localStorage.getItem("dossier-visitor-id");

    if (!visitorId) {
      visitorId = crypto.randomUUID();
      localStorage.setItem("dossier-visitor-id", visitorId);
    }

    async function loadCommunity() {
      if (!currentPostId) return;

      const [commentsResult, reactionsResult] = await Promise.all([
        db
          .from("comments")
          .select("id, post_id, content, display_name, created_at")
          .eq("post_id", currentPostId)
          .order("created_at", { ascending: false }),
        db
          .from("reactions")
          .select("reaction")
          .eq("post_id", currentPostId)
      ]);

      const commentStatus = document.getElementById("comment-status");

      if (commentsResult.error) {
        console.error("Comments loading error:", commentsResult.error);
        commentStatus.textContent = "Comments could not be loaded.";
      } else {
        renderComments(commentsResult.data || []);
      }

      if (reactionsResult.error) {
        console.error("Reactions loading error:", reactionsResult.error);
        return;
      }

      const reactions = reactionsResult.data || [];

      document.getElementById("like-count").textContent =
        reactions.filter(item => item.reaction === "interesting").length;

      document.getElementById("mind-count").textContent =
        reactions.filter(item => item.reaction === "mindblowing").length;
    }

    function renderComments(comments) {
      const list = document.getElementById("comments-list");
      list.replaceChildren();

      if (!comments.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "community-intro";
        emptyMessage.textContent = "No comments yet. Be the first to share your thoughts.";
        list.appendChild(emptyMessage);
        return;
      }

      comments.forEach(comment => {
        const card = document.createElement("article");
        card.className = "comment-card";

        const author = document.createElement("span");
        author.className = "comment-author";
        author.textContent = comment.display_name || "Anonymous";

        const date = document.createElement("span");
        date.className = "comment-date";
        date.textContent = comment.created_at
          ? new Date(comment.created_at).toLocaleDateString()
          : "";

        const content = document.createElement("p");
        content.className = "comment-text";
        content.textContent = comment.content || "";

        card.append(author, date, content);
        list.appendChild(card);
      });
    }

    async function addReaction(reaction) {
      if (!currentPostId) return;

      const buttons = document.querySelectorAll(".reaction-btn");
      buttons.forEach(button => button.disabled = true);

      const { error } = await db.from("reactions").insert({
        post_id: currentPostId,
        reaction,
        visitor_id: visitorId,
        user_id: null
      });

      buttons.forEach(button => button.disabled = false);

      if (error) {
        console.error("Reaction insert error:", error);
        document.getElementById("comment-status").textContent =
          "Reaction failed. Please try again.";
        return;
      }

      document.getElementById("comment-status").textContent =
        "Thanks for your reaction!";
      await loadCommunity();
    }

    async function submitComment() {
      const nameInput = document.getElementById("comment-name");
      const contentInput = document.getElementById("comment-input");
      const status = document.getElementById("comment-status");
      const button = document.getElementById("comment-submit");

      const name = nameInput.value.trim();
      const content = contentInput.value.trim();

      if (!content) {
        status.textContent = "Please write a comment first.";
        return;
      }

      if (content.length > 2000 || name.length > 40) {
        status.textContent = "Your comment or name is too long.";
        return;
      }

      button.disabled = true;
      status.textContent = "Posting comment...";

      const { error } = await db.from("comments").insert({
        post_id: currentPostId,
        content,
        display_name: name || "Anonymous",
        user_id: null
      });

      button.disabled = false;

      if (error) {
        console.error("Comment insert error:", error);
        status.textContent =
          "Comment could not be posted. Please try again.";
        return;
      }

      contentInput.value = "";
      status.textContent = "Comment posted!";
      await loadCommunity();
    }

    document.getElementById("like-btn").addEventListener("click", () => {
      addReaction("interesting");
    });

    document.getElementById("mind-btn").addEventListener("click", () => {
      addReaction("mindblowing");
    });

    document.getElementById("comment-submit").addEventListener("click", submitComment);

      const { data, error } = await db
        .from("posts")
        .select("id, title, slug, category")
        .eq("published", true)
        .neq("id", currentId)
        .order("created_at", { ascending: false })
        .limit(4);

      if (error) {
        console.error("Related stories error:", error);
        return;
      }

      if (!data || data.length === 0) return;

      const grid = document.getElementById("related-grid");
      grid.replaceChildren();

      data.forEach(post => {
        const link = document.createElement("a");
        link.className = "related-card";
        link.href = `article.html?${post.slug
          ? `slug=${encodeURIComponent(post.slug)}`
          : `id=${encodeURIComponent(post.id)}`}`;

        const category = document.createElement("span");
        category.textContent = post.category || "Mystery";

        const title = document.createElement("h3");
        title.textContent = post.title || "Untitled story";

        link.append(category, title);
        grid.appendChild(link);
      });

      document.getElementById("related-section").hidden = false;
    }

    async function loadCommunity() {
      if (!currentPostId) return;

      const [commentsResult, reactionsResult] = await Promise.all([
        db
          .from("comments")
          .select("id, post_id, content, display_name, created_at")
          .eq("post_id", currentPostId)
          .order("created_at", { ascending: false }),
        db
          .from("reactions")
          .select("reaction")
          .eq("post_id", currentPostId)
      ]);

      if (commentsResult.error) {
        console.error("Comments loading error:", commentsResult.error);
      } else {
        renderComments(commentsResult.data || []);
      }

      if (reactionsResult.error) {
        console.error("Reactions loading error:", reactionsResult.error);
        return;
      }

      const reactions = reactionsResult.data || [];

      document.getElementById("like-count").textContent =
        reactions.filter(item => item.reaction === "interesting").length;

      document.getElementById("mind-count").textContent =
        reactions.filter(item => item.reaction === "mindblowing").length;
    }

    loadArticle();
  </script>
</body>
</html>
